[project]
name = "vpipe"
version = "0.1.0"
description = "Reproducible, headless, CPU-only Vesuvius Challenge segment-to-ink pipeline with numeric checks against published results"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "tifffile>=2024.8",
  "imagecodecs>=2024.6",
  "zarr>=3.0",
  "pillow>=10.0",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
